global
    user haproxy
    group haproxy
    daemon
defaults
    mode tcp
    timeout connect 3s
    timeout client 60s
    timeout server 60s
listen postgres
    bind 127.0.0.1:5432
    option httpchk GET /primary
    http-check expect status 200
    default-server inter 2s fall 2 rise 2 on-marked-down shutdown-sessions
    server db1 10.66.0.21:5432 check port 8008
    server db2 10.66.0.22:5432 check port 8008
    server db3 10.66.0.23:5432 check port 8008
